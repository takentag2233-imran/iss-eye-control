<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>ISS Mobile Core v6.0</title>
    
    <!-- ⚡ HIGH-PERFORMANCE GLOBAL CDN INTEGRATION FOR APK CONTAINERS -->
    <script src="https://jsdelivr.net" crossorigin="anonymous"></script>
    <script src="https://jsdelivr.net" crossorigin="anonymous"></script>

    <style>
        body {
            margin: 0; padding: 0; background: #05070c;
            font-family: 'Segoe UI', Arial, sans-serif; color: white; overflow: hidden;
        }
        #iss-permission-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, #05070c 0%, #0c1626 100%);
            z-index: 99999; display: flex; flex-direction: column;
            justify-content: center; align-items: center; padding: 25px; box-sizing: border-box;
            transition: opacity 0.4s ease;
        }
        .iss-logo-box {
            font-size: 26px; font-weight: 900; color: #00ffcc;
            text-shadow: 0 0 20px rgba(0, 255, 204, 0.5); letter-spacing: 2px; margin-bottom: 5px;
        }
        .iss-dev-credits {
            font-size: 12px; color: #3b82f6; font-weight: bold; letter-spacing: 3px; margin-bottom: 35px;
        }
        .iss-permission-card {
            width: 100%; max-width: 340px; background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(0, 255, 204, 0.2); border-radius: 20px; padding: 25px; text-align: center;
        }
        .iss-permission-card h3 { margin: 0 0 10px 0; font-size: 18px; }
        .iss-permission-card p { margin: 0 0 25px 0; color: #94a3b8; font-size: 13px; line-height: 1.5; }
        .iss-grant-btn {
            width: 100%; padding: 16px; background: #00ffcc; color: #05070c;
            border: none; border-radius: 12px; font-size: 16px; font-weight: bold; cursor: pointer;
        }
        #iss-floating-hud {
            position: fixed; top: 15px; left: 15px; z-index: 1000;
            background: rgba(0, 255, 204, 0.12); padding: 10px 20px;
            border-radius: 30px; border: 1px solid #00ffcc; font-weight: bold; color: #00ffcc; font-size: 11px;
        }
        #iss-cam-feed {
            position: fixed; bottom: 20px; right: 20px; width: 95px; height: 130px;
            object-fit: cover; border-radius: 14px; border: 2px solid #3b82f6; z-index: 999; transform: scaleX(-1); display: none;
        }
        #iss-lens-pointer {
            position: fixed; width: 24px; height: 24px; border: 3px solid #00ffcc;
            border-radius: 50%; top: 50%; left: 50%; transform: translate(-50%, -50%); pointer-events: none; z-index: 10000; display: none; box-shadow: 0 0 15px #00ffcc;
        }
        .iss-screen-container {
            display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; gap: 20px; padding: 20px; box-sizing: border-box;
        }
        .iss-toggle-container {
            background: rgba(255,255,255,0.03); border: 1px solid #1e293b; border-radius: 16px; padding: 15px 25px; display: flex; align-items: center; justify-content: space-between; width: 100%; max-width: 320px; box-sizing: border-box;
        }
        .toggle-switch {
            position: relative; display: inline-block; width: 50px; height: 26px;
        }
        .toggle-switch input { opacity: 0; width: 0; height: 0; }
        .slider {
            position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #334155; transition: .4s; border-radius: 34px;
        }
        .slider:before {
            position: absolute; content: ""; height: 18px; width: 18px; left: 4px; bottom: 4px; background-color: white; transition: .4s; border-radius: 50%;
        }
        input:checked + .slider { background-color: #00ffcc; }
        input:checked + .slider:before { transform: translateX(24px); }
        .iss-target-card {
            width: 100%; max-width: 320px; padding: 35px 20px; background: rgba(255, 255, 255, 0.02);
            border: 2px solid #1e293b; border-radius: 20px; text-align: center; font-size: 17px; font-weight: bold; position: relative; box-sizing: border-box; transition: border-color 0.2s ease;
        }
        .iss-progress-bar {
            position: absolute; bottom: 0; left: 0; height: 5px; width: 0%; background: #00ffcc; transition: width 0.1s linear; border-bottom-left-radius: 18px; border-bottom-right-radius: 18px;
        }
    </style>
</head>
<body>

    <!-- 🚀 STARTUP BRANDING INTERFACE -->
    <div id="iss-permission-overlay">
        <div class="iss-logo-box">IMRAN SIGMA SOFTWARES</div>
        <div class="iss-dev-credits">DEVELOPER: IMRAN ALI</div>
        <div class="iss-permission-card">
            <h3>Camera Bypass Request</h3>
            <p>ISS Engine ko chehre ke landmarks aur ankhon ke eye gestures ko track karne ke liye hardware access zaroorat hai.</p>
            <button class="iss-grant-btn" onclick="requestIssSystemAccess()">ALLOW HARDWARE ACCESS</button>
        </div>
    </div>

    <div id="iss-floating-hud">⚡ ISS CORE ENGINE: STANDBY</div>
    <div id="iss-lens-pointer"></div>
    <video id="iss-cam-feed" autoplay playsinline></video>

    <div class="iss-screen-container">
        <!-- ⚙️ VVIP MASTER CONTROL SWITCH BUTTON -->
        <div class="iss-toggle-container">
            <span style="font-weight: bold; font-size: 14px; letter-spacing: 1px;">ISS EYE RUNTIME</span>
            <label class="toggle-switch">
                <input type="checkbox" id="iss-master-toggle" checked onchange="toggleIssEngineStatus()">
                <span class="slider"></span>
            </label>
        </div>

        <div class="iss-target-card" id="card-tiktok">
            📲 AUTOMATED TIKTOK CORE
            <div class="iss-progress-bar" id="p1"></div>
        </div>
        <div class="iss-target-card" id="card-shorts">
            🎥 YOUTUBE SHORTS FEED
            <div class="iss-progress-bar" id="p2"></div>
        </div>
    </div>
    <script>
        const videoElement = document.getElementById('iss-cam-feed');
        const pointer = document.getElementById('iss-lens-pointer');
        const permissionScreen = document.getElementById('iss-permission-overlay');
        const masterToggle = document.getElementById('iss-master-toggle');
        
        let dwellTimer = null;
        let targetedElement = null;
        const TARGET_LOCK_DURATION = 2000; 
        let lastGestureTimestamp = 0;
        let engineActive = false;
        let cameraStreamInstance = null; // FIXED: None se null kiya

        // --- MASTER TOGGLE SWITCH MANAGER ---
        function toggleIssEngineStatus() {
            if (masterToggle.checked) {
                engineActive = true;
                pointer.style.display = 'block';
                document.getElementById('iss-floating-hud').innerText = "⚡ ISS CORE ENGINE: ACTIVE";
                document.getElementById('iss-floating-hud').style.color = "#00ffcc";
            } else {
                engineActive = false;
                clearDwellMetrics();
                pointer.style.display = 'none';
                document.getElementById('iss-floating-hud').innerText = "💤 ISS ENGINE: PAUSED";
                document.getElementById('iss-floating-hud').style.color = "#a1a1aa";
            }
        }

        function requestIssSystemAccess() {
            navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } })
            .then(function(stream) {
                cameraStreamInstance = stream;
                permissionScreen.style.opacity = '0';
                setTimeout(() => { 
                    permissionScreen.style.display = 'none'; 
                    videoElement.style.display = 'block';
                    pointer.style.display = 'block';
                    document.getElementById('iss-floating-hud').innerText = "⚡ ISS CORE ENGINE: ACTIVE";
                }, 300);
                engineActive = true;
                initializeIssTrackingCore();
            })
            .catch(function(err) {
                alert("[-] ISS Error: Hardware access denied.");
            });
        }

        function onFaceMeshTrackingResults(results) {
            if (!engineActive || !results.multiFaceLandmarks || results.multiFaceLandmarks.length === 0) {
                clearDwellMetrics();
                return;
            }

            const faceLandmarks = results.multiFaceLandmarks[0]; // FIXED: First array index mapping
            
            // Right Pupil center tracking node (Index: 473)
            const pupilNode = faceLandmarks[473]; 
            if (!pupilNode) return;
            
            const computedX = (1 - pupilNode.x) * window.innerWidth;
            const computedY = pupilNode.y * window.innerHeight;
            
            pointer.style.left = computedX + 'px';
            pointer.style.top = computedY + 'px';

            // --- 2-SECOND FIXED DWELL ENGINE ---
            const elementMarker = document.elementFromPoint(computedX, computedY);
            const activeCard = elementMarker ? elementMarker.closest('.iss-target-card') : null;

            if (activeCard) {
                if (targetedElement !== activeCard) {
                    clearDwellMetrics();
                    targetedElement = activeCard;
                    dwellTimer = Date.now();
                } else {
                    const dynamicDelay = Date.now() - dwellTimer;
                    const progressRatio = Math.min((dynamicDelay / TARGET_LOCK_DURATION) * 100, 100);
                    
                    const progressBar = activeCard.querySelector('.iss-progress-bar');
                    if (progressBar) progressBar.style.width = progressRatio + '%';
                    activeCard.style.borderColor = '#00ffcc';

                    if (dynamicDelay >= TARGET_LOCK_DURATION) {
                        alert(`[ISS Victory]: Target lock triggered via Imran Ali tracking algorithm on: ${activeCard.id}`);
                        clearDwellMetrics();
                    }
                }
            } else {
                clearDwellMetrics();
            }

            // --- EYEBROW SHORTS / REELS SCROLL PIPELINE ---
            const eyebrowNode = faceLandmarks[70]; // Fixed Eyebrow Index
            const eyeSocketNode = faceLandmarks[159]; // Fixed Eye Socket Index
            
            if (eyebrowNode && eyeSocketNode) {
                const dynamicEyebrowGap = eyeSocketNode.y - eyebrowNode.y;
                const sessionTime = Date.now();

                if (sessionTime - lastGestureTimestamp > 1400) { 
                    if (dynamicEyebrowGap > 0.054) { 
                        window.scrollBy({ top: window.innerHeight, behavior: 'smooth' });
                        triggerHudNotification("SCROLL DOWN (NEXT REEL)");
                        lastGestureTimestamp = sessionTime;
                    } else if (dynamicEyebrowGap < 0.037) { 
                        window.scrollBy({ top: -window.innerHeight, behavior: 'smooth' });
                        triggerHudNotification("SCROLL UP (PREVIOUS REEL)");
                        lastGestureTimestamp = sessionTime;
                    }
                }
            }
        }

        function clearDwellMetrics() {
            if (targetedElement) {
                const progressBar = targetedElement.querySelector('.iss-progress-bar');
                if (progressBar) progressBar.style.width = '0%';
                targetedElement.style.borderColor = '#1e293b';
            }
            dwellTimer = null;
            targetedElement = null;
        }

        function triggerHudNotification(alertString) {
            const hud = document.getElementById('iss-floating-hud');
            hud.innerText = `⚙️ ISS: ${alertString}`;
            hud.style.color = '#ff0055';
            setTimeout(() => {
                if(engineActive) {
                    hud.innerText = `⚡ ISS CORE ENGINE: ACTIVE`;
                    hud.style.color = '#00ffcc';
                }
            }, 1000);
        }

        function initializeIssTrackingCore() {
            const faceMeshEngine = new FaceMesh({
                locateFile: (file) => `https://jsdelivr.net{file}`
            });
            
            faceMeshEngine.setOptions({
                maxNumFaces: 1, refineLandmarks: true, minDetectionConfidence: 0.6, minTrackingConfidence: 0.6
            });
            faceMeshEngine.onResults(onFaceMeshTrackingResults);

            const cameraLayer = new Camera(videoElement, {
                onFrame: async () => { 
                    if(engineActive) { await faceMeshEngine.send({ image: videoElement }); }
                },
                width: 480, height: 640
            });
            cameraLayer.start();
        }
    </script>
</body>
</html>
